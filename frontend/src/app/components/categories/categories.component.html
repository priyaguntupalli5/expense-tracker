<div class="list-container">
  <mat-card class="list-card">
    <div class="card-header">
      <div class="card-title">
        <mat-icon class="title-icon">label</mat-icon>
        <span>Categories</span>
        <span class="count-chip">{{ categories.length }}</span>
      </div>
      <button mat-flat-button color="primary" class="add-btn" (click)="openAdd()">
        <mat-icon>add</mat-icon> Add
      </button>
    </div>

    <mat-card-content>
      @if (categories.length === 0) {
        <div class="empty-state">
          <mat-icon>label_off</mat-icon>
          <p>No categories yet</p>
        </div>
      } @else {
        <div class="cat-list">
          @for (c of categories; track c.id) {
            <div class="cat-row">
              <span class="cat-accent" [style.background]="c.color"></span>
              <span class="cat-badge"
                [style.background]="c.color + '18'"
                [style.color]="c.color"
                [style.border-color]="c.color + '55'">
                <mat-icon class="badge-icon">{{ c.icon }}</mat-icon>
                {{ c.label }}
              </span>
              <span class="row-spacer"></span>
              <div class="row-actions">
                <button mat-icon-button matTooltip="Edit" (click)="openEdit(c)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button matTooltip="Delete" color="warn" (click)="confirmDelete(c)">
                  <mat-icon>delete_outline</mat-icon>
                </button>
              </div>
            </div>
          }
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
