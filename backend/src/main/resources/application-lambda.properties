# Overrides for AWS Lambda — activated by LambdaHandler, never in local/EC2 runs.
#
# Set these as Lambda environment variables:
#   SPRING_DATASOURCE_URL       jdbc:mysql://<tidb-host>:4000/expensetracker?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
#   SPRING_DATASOURCE_USERNAME  <prefix>.root
#   SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
#   APP_JOBS_SECRET             shared secret EventBridge Scheduler sends in X-Job-Secret

# Schema is managed outside Lambda; skip schema.sql/data.sql, SchemaMigration,
# the startup recurring-entry catch-up and the category seeder on every cold start.
spring.sql.init.mode=never
app.startup-jobs.enabled=false

# A frozen Lambda would fire missed @Scheduled jobs late on thaw; EventBridge Scheduler
# calls JobController instead.
app.scheduling.enabled=false

# TiDB is MySQL-compatible. With the dialect fixed, Hibernate needn't open a connection
# at boot, so no DB connection ends up inside the SnapStart snapshot.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# One request at a time per Lambda instance — keep the pool tiny and open nothing up front.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.keepalive-time=0

spring.main.banner-mode=off
