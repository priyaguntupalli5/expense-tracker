spring.application.name=expense-tracker

# MySQL / MariaDB — credentials loaded from backend/.env (never committed)
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Run schema.sql automatically on every startup (CREATE TABLE IF NOT EXISTS = safe to repeat)
spring.sql.init.mode=always

# JPA / Hibernate — let schema.sql handle table creation
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

server.port=8080
