spring.application.name=expense-tracker

# MySQL — Railway injects MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD automatically.
# Locally, fall back to DB_* vars from backend/.env (never committed).
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:expense_tracker}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}

# Run schema.sql automatically on every startup (CREATE TABLE IF NOT EXISTS = safe to repeat)
spring.sql.init.mode=always

# JPA / Hibernate — let schema.sql handle table creation
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

server.port=8080

# Serve the PWA manifest with its proper type so browsers recognize it
server.mime-mappings.webmanifest=application/manifest+json

# JWT — secret must be at least 32 chars; expiration in milliseconds (86400000 = 24h)
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# VAPID keys for Web Push notifications — add to backend/.env after generating
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:https://localhost}
